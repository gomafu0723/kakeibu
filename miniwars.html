<style>

    padding:8px 12px;background:linear-gradient(180deg,#2a3068,#191d3e);
    font-size:13px;font-weight:bold;
    border-bottom:2px solid var(--gold2);
    box-shadow:0 3px 12px rgba(0,0,0,.55);z-index:2;}
  #turnbadge{padding:4px 13px;border-radius:99px;
    background:linear-gradient(180deg,#5486ef,#2f5cc4);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 5px rgba(0,0,0,.4);
    white-space:nowrap;}
  .funds{color:var(--gold);white-space:nowrap;}
  #mutebtn,#menubtn,#homebtn{background:none;border:none;font-size:18px;box-shadow:none;padding:2px 4px;}

  #mapwrap{flex:1;position:relative;overflow:hidden;touch-action:none;background:
      radial-gradient(ellipse at 50% 30%, #1b1f44 0%, #0c0e22 80%);}

    border-top:2px solid var(--gold2);padding:8px 10px;min-height:118px;z-index:2;

  #info{font-size:13px;line-height:1.45;min-height:48px;display:flex;

    background:rgba(0,0,0,.22);box-shadow:inset 0 1px 3px rgba(0,0,0,.4);}
  #info b{color:var(--gold);}
  #info img{height:38px;image-rendering:pixelated;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));}

    text-shadow:0 1px 0 rgba(255,255,255,.4);}

    font-size:23px;font-weight:900;color:#fff;letter-spacing:.2em;z-index:9;
    background:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.88) 18%,rgba(0,0,0,.88) 82%,transparent 100%);

  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);
    display:flex;justify-content:center;align-items:center;z-index:10;}
  #overlay.hidden{display:none;}
  .dialog{background:var(--panel);border:3px solid var(--gold);
    border-radius:12px;padding:18px;width:min(340px,92vw);text-align:center;
    max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    box-shadow:0 12px 40px rgba(0,0,0,.7);animation:pop .25s ease;}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}

function buildSprites(){
  const SC=6;
  for(const type in PX){
    sprCv[type]=[]; sprUrl[type]=[];
    for(let pid=0;pid<2;pid++){
      const pal={K:"#16161c",S:"#e8b88a",G:"#aeb4bc",W:"#e8e8ee",A:"#9adcf0",R:"#e0424f",
        M:"#4c525e",g:"#cfd4dc",Y:"#ffd76a",
        T:PLAYER_COLOR[pid],t:PLAYER_DARK[pid],H:PLAYER_LIGHT[pid]};
      const rows=PX[type];
      const c=document.createElement("canvas");
      c.width=rows[0].length*SC; c.height=rows.length*SC;
      const g=c.getContext("2d");
      for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++){
        const ch=rows[y][x];
        if(ch==="."||!pal[ch])continue;
        g.fillStyle=pal[ch];
        g.fillRect(x*SC,y*SC,SC,SC);
      }
      sprCv[type][pid]=c;
      sprUrl[type][pid]=c.toDataURL();
    }
  }
}

function silentWavURL(){
  const n=8000;
  const buf=new ArrayBuffer(44+n);
  const v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,"RIFF");v.setUint32(4,36+n,true);ws(8,"WAVE");
  ws(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);
  v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);
  v.setUint16(32,1,true);v.setUint16(34,8,true);
  ws(36,"data");v.setUint32(40,n,true);
  for(let i=0;i<n;i++)v.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}

}

function tone(freq,dur,type,vol,when){
  const a=ac();if(!a||muted)return;
  const t=a.currentTime+(when||0);
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||"square";o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.12,t);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(a.destination);
  o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol,fStart,fEnd,when){
  const a=ac();if(!a||muted)return;
  const t=a.currentTime+(when||0);
  const len=a.sampleRate*dur;
  const buf=a.createBuffer(1,len,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=a.createBufferSource();src.buffer=buf;
  const f=a.createBiquadFilter();f.type="lowpass";
  f.frequency.setValueAtTime(fStart||2000,t);
  f.frequency.exponentialRampToValueAtTime(fEnd||200,t+dur);
  const g=a.createGain();
  g.gain.setValueAtTime(vol||.2,t);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  src.connect(f);f.connect(g);g.connect(a.destination);
  src.start(t);
}

function bgmNote(freq,when,dur,type,vol){
  const a=ac();if(!a||!bgmGain||freq<=0)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.value=freq;
  g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(vol||.08,when+.008);
  g.gain.setValueAtTime(vol||.08,when+dur*.72);
  g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g);g.connect(bgmGain);
  o.start(when);o.stop(when+dur+.05);
}
function bgmKick(when){
  const a=ac();if(!a||!bgmGain)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(130,when);
  o.frequency.exponentialRampToValueAtTime(40,when+.12);
  g.gain.setValueAtTime(.15,when);
  g.gain.exponentialRampToValueAtTime(.001,when+.18);
  o.connect(g);g.connect(bgmGain);
  o.start(when);o.stop(when+.22);
}
function bgmSched(){
  if(!bgmPlaying)return;
  const a=ac();if(!a)return;
  const tr=BGM_TRACKS[bgmTrack]||BGM_TRACKS[0];
  const beat=60/tr.bpm;
  const ahead=a.currentTime+.4;
  while(bgmNextT<ahead){
    const[n,beats]=tr.ml[bgmStep%tr.ml.length];
    const dur=beats*beat;
    if(n>=0)bgmNote(bgmHz(n),bgmNextT,dur*.88,tr.melType,tr.melVol);
    bgmNextT+=dur;bgmStep++;
  }
  while(bgmBassNext<ahead){
    const[bn,bb]=tr.bass[bgmBassStep%tr.bass.length];
    const bdur=bb*beat;
    bgmNote(bgmHz(bn),bgmBassNext,bdur*.85,tr.bassType,.07);
    bgmBassNext+=bdur;bgmBassStep++;
  }
  if(tr.kickEvery>0){
    while(bgmKickNext<ahead){
      bgmKick(bgmKickNext);
      bgmKickNext+=beat*tr.kickEvery;
    }
  }
  bgmTimer=setTimeout(bgmSched,100);
}

  bgmPlaying=true;bgmStep=0;bgmBassStep=0;
  const t=a.currentTime+.12;
  bgmNextT=t;bgmBassNext=t;bgmKickNext=t;
  bgmGain=a.createGain();
  bgmGain.gain.value=.75;
  bgmGain.connect(a.destination);
  bgmSched();
}
function bgmStop(){
  bgmPlaying=false;
  if(bgmTimer){clearTimeout(bgmTimer);bgmTimer=null;}
  if(bgmGain){
    try{const a=ac();if(a)bgmGain.gain.exponentialRampToValueAtTime(.001,a.currentTime+.4);}catch(e){}
    setTimeout(()=>{try{bgmGain.disconnect();}catch(e){}bgmGain=null;},500);
  }
}

function runAnims(dt){
  if(!anims.length)return;
  const a=anims[0];
  if(a.idx<0){a.idx=0;a.t=0;
    if(a.steps.length){const s=a.steps[0];s.onStart&&s.onStart();}}
  while(a.idx<a.steps.length){
    const s=a.steps[a.idx];
    a.t+=dt;
    const p=s.dur>0?Math.min(1,a.t/s.dur):1;
    s.update&&s.update(p);
    if(a.t>=s.dur){a.idx++;a.t=0;
      if(a.idx<a.steps.length){const n=a.steps[a.idx];n.onStart&&n.onStart();}
      continue;}
    break;
  }
  if(a.idx>=a.steps.length){anims.shift();a.done&&a.done();}
}

}

/* ====================================================
   移動範囲（合流先も含む）
==================================================== */
function moveCost(u,t){
  const mt=UNIT_DEF[u.type].moveType;
  if(mt==="air")return 1;
  return TERRAIN_INFO[t].cost[mt];
}
function canMerge(u,occ){
  return occ.pid===u.pid&&occ.type===u.type&&occ!==u
    &&(occ.hp<MAX_HP||u.hp<MAX_HP);
}
function calcMove(u){
  const def=UNIT_DEF[u.type];
  const dist=new Map(),parent=new Map();
  dist.set(key(u.x,u.y),0);
  const q=[{x:u.x,y:u.y,c:0}];
  while(q.length){
    q.sort((a,b)=>a.c-b.c);
    const cur=q.shift();
    if(cur.c>dist.get(key(cur.x,cur.y)))continue;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cur.x+dx,ny=cur.y+dy;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      const occ=unitAt(nx,ny);
      if(occ&&occ.pid!==u.pid)continue;
      const c=cur.c+moveCost(u,map[ny][nx]);
      if(c>def.move)continue;
      const k=key(nx,ny);
      if(dist.has(k)&&dist.get(k)<=c)continue;
      dist.set(k,c);parent.set(k,key(cur.x,cur.y));
      q.push({x:nx,y:ny,c});
    }
  }
  const reach=new Set(),merge=new Set();
  for(const k of dist.keys()){
    const[x,y]=k.split(",").map(Number);
    const occ=unitAt(x,y);
    if(occ&&occ!==u){
      if(canMerge(u,occ)){reach.add(k);merge.add(k);}
      continue;
    }
    reach.add(k);
  }
  return{reach,merge,parent,origin:key(u.x,u.y)};
}
function buildPath(md,destKey){
  const path=[];let k=destKey;
  while(k){const[x,y]=k.split(",").map(Number);
    path.unshift({x,y});
    if(k===md.origin)break;
    k=md.parent.get(k);}
  return path;
}
function enemiesInRange(u){
  const[mn,mx]=UNIT_DEF[u.type].range;
  return units.filter(e=>{
    if(e.hp<=0||e.pid===u.pid)return false;
    if(UNIT_DEF[u.type].vs[UNIT_DEF[e.type].cls]<=0)return false;
    const d=Math.abs(e.x-u.x)+Math.abs(e.y-u.y);
    return d>=mn&&d<=mx;
  });
}

/* ====================================================
   戦闘（相性＋ランク補正＋運＋クリティカル）
==================================================== */
function baseDmg(a,d,aHp){
  const mult=UNIT_DEF[a.type].vs[UNIT_DEF[d.type].cls];
  const tdef=UNIT_DEF[d.type].cls==="air"?0:TERRAIN_INFO[map[d.y][d.x]].def;
  const propBonus=(isProp(map[d.y][d.x])&&getOwner(d.x,d.y)===d.pid&&getPropLevel(d.x,d.y)>=1)?LV2_DEF_BONUS:0;
  return effAtk(a)*mult*(aHp/MAX_HP)-(tdef+RANKS[d.rank].def+propBonus)*0.5;
}
/* ダメージ予測（運・クリティカルを除いた期待値）。攻撃モードのバッジ表示に使用 */
function rollDmg(a,d,aHp){
  let v=baseDmg(a,d,aHp);
  v*=0.9+Math.random()*0.2;          // ±10%の運
  let crit=false;
  if(Math.random()<0.08){v*=1.4;crit=true;} // 8%でクリティカル
  return{dmg:Math.max(1,Math.round(v)),crit};
}
function performAttack(a,d,after){
  const roll=rollDmg(a,d,a.hp);
  const dmg=roll.dmg;
  const dHpAfter=d.hp-dmg;
  const dist=Math.abs(a.x-d.x)+Math.abs(a.y-d.y);
  let counter=0,cCrit=false;
  const cm=UNIT_DEF[d.type].vs[UNIT_DEF[a.type].cls];
  if(dHpAfter>0&&dist===1&&UNIT_DEF[d.type].range[0]===1&&cm>0){
    const atdef=UNIT_DEF[a.type].cls==="air"?0:TERRAIN_INFO[map[a.y][a.x]].def;
    const propBonusA=(isProp(map[a.y][a.x])&&getOwner(a.x,a.y)===a.pid&&getPropLevel(a.x,a.y)>=1)?LV2_DEF_BONUS:0;
    let cv=(effAtk(d)*cm*(dHpAfter/MAX_HP)*0.7
      -(atdef+RANKS[a.rank].def+propBonusA)*0.5);
    cv*=0.9+Math.random()*0.2;
    if(Math.random()<0.08){cv*=1.4;cCrit=true;}
    counter=Math.max(1,Math.round(cv));
  }
  const aHpAfter=a.hp-counter;
  const aExp=dmg+(dHpAfter<=0?8:0);
  const dExp=counter>0?counter+(aHpAfter<=0?8:0):0;
  const aRankUp=aHpAfter>0&&rankFor(a.exp+aExp)>a.rank;
  const dRankUp=dHpAfter>0&&dExp>0&&rankFor(d.exp+dExp)>d.rank;
  const dirX=Math.sign(d.x-a.x),dirY=Math.sign(d.y-a.y);
  const steps=[];
  steps.push({dur:150,onStart:()=>roll.crit?SND.crit():SND.shot(),
    update:p=>{const k=Math.sin(p*Math.PI)*.34;
      a.px=a.x+dirX*k;a.py=a.y+dirY*k;}});
  steps.push({dur:280,onStart:()=>{
    a.px=a.x;a.py=a.y;
    d.hp=dHpAfter;d.flash=1;shake=Math.max(shake,roll.crit?6:4);
    addPopup(d.x,d.y,"-"+dmg,roll.crit?"#ffd76a":"#ff6b5e");
    if(roll.crit)addPopup(d.x,d.y-0.55,"クリティカル！","#ffd76a");
    if(dHpAfter<=0){delete captureProgress[key(d.x,d.y)];}
  }});
  if(dHpAfter<=0){
    steps.push({dur:420,onStart:()=>{explode(d.x,d.y,PLAYER_COLOR[d.pid]);}});
  }else if(counter>0){
    steps.push({dur:150,onStart:()=>cCrit?SND.crit():SND.shot(),
      update:p=>{const k=Math.sin(p*Math.PI)*.3;
        d.px=d.x-dirX*k;d.py=d.y-dirY*k;}});
    steps.push({dur:280,onStart:()=>{
      d.px=d.x;d.py=d.y;
      a.hp=aHpAfter;a.flash=1;shake=Math.max(shake,cCrit?6:3);
      addPopup(a.x,a.y,"-"+counter,cCrit?"#ffd76a":"#ff6b5e");
      if(cCrit)addPopup(a.x,a.y-0.55,"クリティカル！","#ffd76a");
    }});
    if(aHpAfter<=0){
      steps.push({dur:420,onStart:()=>{explode(a.x,a.y,PLAYER_COLOR[a.pid]);}});
    }
  }
  steps.push({dur:180,onStart:()=>{
    if(aHpAfter>0){a.exp+=aExp;addPopup(a.x,a.y,"EXP+"+aExp,"#9ad6ff");}
    if(dHpAfter>0&&dExp>0){d.exp+=dExp;addPopup(d.x,d.y,"EXP+"+dExp,"#9ad6ff");}
  }});
  if(aRankUp)steps.push({dur:780,onStart:()=>{a.rank=rankFor(a.exp);rankUpFx(a);}});
  if(dRankUp)steps.push({dur:780,onStart:()=>{d.rank=rankFor(d.exp);rankUpFx(d);}});
  pushAnim(steps,()=>{
    units=units.filter(u=>u.hp>0);
    const m=UNIT_DEF[a.type].vs[UNIT_DEF[d.type].cls];
    let msg=`${UNIT_DEF[a.type].name}の攻撃！ <b>${dmg}</b>ダメージ`;
    if(roll.crit)msg+="<b>（クリティカル！）</b>";
    else if(m>=1.2)msg+="（効果バツグン！）";
    if(dHpAfter<=0)msg+=" → 撃破！";
    else if(counter>0){msg+=`／反撃で<b>${counter}</b>被弾`;
      if(aHpAfter<=0)msg+=" → 撃破された！";}
    if(aRankUp)msg+=`<br>🎖️ ${PLAYER_NAME[a.pid]}の${UNIT_DEF[a.type].name}が<b>${RANKS[a.rank].name}</b>に昇格！`;
    if(dRankUp)msg+=`<br>🎖️ ${PLAYER_NAME[d.pid]}の${UNIT_DEF[d.type].name}が<b>${RANKS[d.rank].name}</b>に昇格！`;
    after&&after(msg);
  });
}
function tryCapture(u){
  const t=map[u.y][u.x];
  if(!UNIT_DEF[u.type].canCapture)return null;
  if(!isProp(t))return null;
  if(getOwner(u.x,u.y)===u.pid)return null;
  const k=key(u.x,u.y);
  let cp=captureProgress[k];
  if(!cp||cp.pid!==u.pid)cp={pid:u.pid,amount:0};
  cp.amount+=u.hp;
  if(cp.amount>=CAPTURE_NEED){
    delete captureProgress[k];
    setOwner(u.x,u.y,u.pid);
    SND.capture();
    addPopup(u.x,u.y,"占領！","#ffd76a");
    gainCaptureExp(u);
    if(t===T.HQ){gameOver(u.pid);return"HQ占領！";}
    return TERRAIN_INFO[t].name+"を占領した！";
  }
  captureProgress[k]=cp;
  SND.select();
  addPopup(u.x,u.y,cp.amount+"/"+CAPTURE_NEED,"#ffd76a");
  return`占領中… ${cp.amount}/${CAPTURE_NEED}`;
}
/* 開発できるか判定：都市/工場/本拠地で、自軍の所有物で、まだLv2でなく、占領可能なユニット種 */
function canDevelopHere(u){
  const t=map[u.y][u.x];
  if(!(t===T.CITY||t===T.FACTORY||t===T.HQ))return false;
  if(getOwner(u.x,u.y)!==u.pid)return false;
  if(getPropLevel(u.x,u.y)>=1)return false;
  return !!UNIT_DEF[u.type].canCapture;
}
function tryDevelop(u){
  const k=key(u.x,u.y);
  let dp=developProgress[k];
  if(!dp||dp.pid!==u.pid)dp={pid:u.pid,amount:0};
  dp.amount+=u.hp;
  if(dp.amount>=DEVELOP_NEED){
    delete developProgress[k];
    propLevel[k]=1;
    SND.rankup();
    addPopup(u.x,u.y,"Lv.2化！","#ffd76a");
    terrainDirty=true;
    const canProduce=(map[u.y][u.x]===T.FACTORY||map[u.y][u.x]===T.HQ);
    return TERRAIN_INFO[map[u.y][u.x]].name+"が発展した！（回復↑／防御↑"+
      (canProduce?"／生産費↓":"")+"）";
  }
  developProgress[k]=dp;
  SND.select();
  addPopup(u.x,u.y,dp.amount+"/"+DEVELOP_NEED,"#9ad6ff");
  return`開発中… ${dp.amount}/${DEVELOP_NEED}`;
}
/* 発掘できるか判定：山/森で、歩兵か救急隊のみ */
function canMineHere(u){
  const t=map[u.y][u.x];
  if(!(t===T.MTN||t===T.FOREST))return false;
  return u.type==="inf"||u.type==="medic";
}
function tryMine(u){
  const r=Math.random();
  let acc=0,amount=0;
  for(const row of MINE_TABLE){
    acc+=row.p;
    if(r<=acc){amount=row.min===row.max?row.min:Math.round(row.min+Math.random()*(row.max-row.min));break;}
  }
  u.acted=true;
  if(amount<=0){
    SND.cancel();
    return"発掘… 何も見つからなかった";
  }
  funds[u.pid]+=amount;
  const jackpot=amount>=8000;
  SND.coin();
  addPopup(u.x,u.y,"+"+amount+"G",jackpot?"#ffd76a":"#7dff9a");
  if(jackpot){
    for(let i=0;i<16;i++){
      const ang=Math.random()*6.28,sp=.6+Math.random()*1.6;
      particles.push({x:u.x+.5,y:u.y+.5,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-1,
        life:.6+Math.random()*.4,maxLife:1,size:.08+Math.random()*.1,color:"#ffd76a"});
    }
  }
  return(jackpot?"⛏ 大金を発見！ +":"⛏ 発掘… +")+amount+"G";
}
function doMerge(u,t){
  t.hp=Math.min(MAX_HP,u.hp+t.hp);
  t.exp=Math.max(t.exp,u.exp);
  const nr=rankFor(t.exp);
  if(nr>t.rank){t.rank=nr;rankUpFx(t);}
  t.acted=true;t.flash=1;
  u.hp=0;
  units=units.filter(x=>x.hp>0);
  SND.capture();
  addPopup(t.x,t.y,"合流！","#7dff9a");
  finishAction(`${UNIT_DEF[t.type].name}が合流しました（HP ${t.hp}）`);
}

function beginTurn(pid){
  let income=0;
  for(const k in owner)if(owner[k]===pid)income+=1000;
  funds[pid]+=income;
  for(const u of units)if(u.pid===pid)u.acted=false;
  for(const u of units){
    if(u.pid!==pid)continue;
    const t=map[u.y][u.x];
    if(isProp(t)&&getOwner(u.x,u.y)===pid&&u.hp<MAX_HP){
      const healAmt=getPropLevel(u.x,u.y)>=1?LV2_HEAL:4;
      u.hp=Math.min(MAX_HP,u.hp+healAmt);
      addPopup(u.x,u.y,"+"+healAmt,"#7dff9a");
    }
  }
}

/* ====================================================
   CPU（赤軍）AI
==================================================== */
let aiList=[];
/* 座標(x,y)に対する相手軍の脅威度（到達+射程の余裕を合算） */
function aiThreatLevel(x,y,pid){
  let threat=0;
  for(const e of units){
    if(e.pid!==pid||e.hp<=0)continue;
    const ed=UNIT_DEF[e.type];
    const reach=ed.move+(ed.range?ed.range[1]:1);
    const d=Math.abs(e.x-x)+Math.abs(e.y-y);
    if(d<=reach)threat+=Math.max(0,reach-d+1);
  }
  return threat;
}
/* AI専用の簡易ダメージ予測（プレイヤーには表示しない） */
function aiPredictDamage(a,d){
  return Math.max(1,Math.round(baseDmg(a,d,a.hp)));
}
function aiCounterDamage(a,d){
  const dmg=aiPredictDamage(a,d);
  const dHpAfter=d.hp-dmg;
  if(dHpAfter<=0)return 0;
  const dist=Math.abs(a.x-d.x)+Math.abs(a.y-d.y);
  if(dist!==1)return 0;
  const cm=UNIT_DEF[d.type].vs[UNIT_DEF[a.type].cls];
  if(!(cm>0))return 0;
  const atdef=UNIT_DEF[a.type].cls==="air"?0:TERRAIN_INFO[map[a.y][a.x]].def;
  const cv=effAtk(d)*cm*(dHpAfter/MAX_HP)*0.7-(atdef+RANKS[a.rank].def)*0.5;
  return Math.max(0,Math.round(cv));
}
/* 撃破優先＋集中攻撃＋損な取引の回避で標的を選ぶ */
function pickAiTarget(u,targets){
  let best=null,bestScore=-1e9;
  for(const t of targets){
    const dmg=aiPredictDamage(u,t);
    const lethal=dmg>=t.hp;
    const counter=aiCounterDamage(u,t);
    const value=UNIT_DEF[t.type].cost/1000+RANKS[t.rank].atk;
    let score;
    if(lethal) score=1000+value*10-t.hp*0.1;
    else       score=dmg*2-counter*1.6+(MAX_HP-t.hp)*0.6;
    if(score>bestScore){bestScore=score;best=t;}
  }
  return best;
}
/* 移動先(x,y)から狙える最良の標的（今その場にいるつもりで判定） */
function aiTargetsFromPos(u,x,y){
  const[mn,mx]=UNIT_DEF[u.type].range;
  return units.filter(e=>{
    if(e.hp<=0||e.pid===u.pid)return false;
    if(UNIT_DEF[u.type].vs[UNIT_DEF[e.type].cls]<=0)return false;
    const d=Math.abs(e.x-x)+Math.abs(e.y-y);
    return d>=mn&&d<=mx;
  });
}
function aiStart(){
  aiList=units.filter(u=>u.pid===RED&&u.hp>0);
  aiNext();
}
function aiNext(){
  if(ended)return;
  const u=aiList.shift();
  if(!u){aiProduce();return;}
  if(u.hp<=0){aiNext();return;}
  aiActUnit(u,()=>setTimeout(aiNext,150));
}
function aiDoHeal(medic,target){
  const amt=Math.min(UNIT_DEF[medic.type].heal,MAX_HP-target.hp);
  target.hp+=amt;target.flash=1;
  SND.heal();
  addPopup(target.x,target.y,"+"+amt,"#7fe08a");
  medic.acted=true;
}
function aiActUnit(u,next){
  const ud=UNIT_DEF[u.type];
  const fragile=(u.type==="art"||u.type==="rocket"||u.type==="recon"||u.type==="medic");
  // 医療兵はその場に負傷した味方が隣接していれば最優先で回復する
  if(ud.heal){
    const ht=healTargets(u);
    if(ht.length){
      ht.sort((a,b)=>a.hp-b.hp); // 一番減っている味方を優先
      aiDoHeal(u,ht[0]);
      next();return;
    }
  }
  // その場から攻撃できるなら、集中攻撃・撃破優先で狙う
  let tg=enemiesInRange(u);
  if(tg.length){
    const t=pickAiTarget(u,tg);
    performAttack(u,t,msg=>{u.acted=true;updateUI(msg);
      if(checkEnded())return;next();});
    return;
  }
  const md=calcMove(u);
  const rng=ud.range;
  const lowHp=u.hp<MAX_HP*0.4;
  let best=null,bestScore=-1e9;
  for(const k of md.reach){
    if(md.merge.has(k))continue;
    const[x,y]=k.split(",").map(Number);
    let score=0;
    const t=map[y][x];
    if(ud.canCapture&&isProp(t)&&getOwner(x,y)!==RED)score+=200;

    // この位置から攻撃可能か（撃破できるなら大きく加点＝進んで仕留めに行く）
    const reachTargets=aiTargetsFromPos(u,x,y);
    if(reachTargets.length){
      const best2=pickAiTarget(u,reachTargets);
      const dmg2=aiPredictDamage(u,best2);
      score+= dmg2>=best2.hp ? 400 : 120;
    }

    let nd=99;
    for(const e of units)if(e.pid===BLUE&&e.hp>0)
      nd=Math.min(nd,Math.abs(e.x-x)+Math.abs(e.y-y));

    if(ud.heal){
      // 医療兵は負傷している味方に近づくことを最優先する
      let hd=99;
      for(const e of units)if(e.pid===RED&&e.hp>0&&e.hp<MAX_HP&&e!==u)
        hd=Math.min(hd,Math.abs(e.x-x)+Math.abs(e.y-y));
      if(hd<99)score+=Math.max(0,150-hd*10);
      score-=aiThreatLevel(x,y,BLUE)*4; // 医療兵は特に危険地帯を避ける
    }else if(lowHp&&!reachTargets.length&&!(ud.canCapture&&isProp(t)&&getOwner(x,y)!==RED)){
      // HPが低く、仕留められる相手も占領先もないなら後退して立て直す
      score+=nd*4;
      score-=(Math.abs(HQ_POS[RED].x-x)+Math.abs(HQ_POS[RED].y-y))*2;
    }else if(isIndirect(u)){
      if(nd>=rng[0]&&nd<=rng[1])score+=80;
      else if(nd<rng[0])score-=30;
      else score-=nd*5;
    }else{
      score-=nd*5;
      score-=(Math.abs(HQ_POS[BLUE].x-x)+Math.abs(HQ_POS[BLUE].y-y))*2;
    }

    // 脆いユニットは敵の脅威範囲を避ける（無駄死に防止）
    if(fragile)score-=aiThreatLevel(x,y,BLUE)*3;

    if(score>bestScore){bestScore=score;best=k;}
  }
  const finish=()=>{
    if(ud.heal){
      const ht2=healTargets(u);
      if(ht2.length){
        ht2.sort((a,b)=>a.hp-b.hp);
        aiDoHeal(u,ht2[0]);
        next();return;
      }
    }
    if(!isIndirect(u)){
      let tg2=enemiesInRange(u);
      if(tg2.length){
        const t2=pickAiTarget(u,tg2);
        performAttack(u,t2,msg=>{u.acted=true;updateUI(msg);
          if(checkEnded())return;next();});
        return;
      }
    }
    const c=tryCapture(u);
    if(c)updateUI("赤軍："+c);
    u.acted=true;
    if(checkEnded())return;
    next();
  };
  if(best&&best!==md.origin){
    const path=buildPath(md,best);
    const[x,y]=best.split(",").map(Number);
    u.x=x;u.y=y;
    animateMove(u,path,finish);
  }else finish();
}
/* 自軍(青)の現在の兵科構成を見て、相性の良いユニットを重点的に選ぶ */
function aiPickType(){
  const blueTypes=units.filter(u=>u.pid===BLUE&&u.hp>0).map(u=>u.type);
  const blueHasAir=blueTypes.some(t=>UNIT_DEF[t].cls==="air");
  const redDamaged=units.some(u=>u.pid===RED&&u.hp>0&&u.hp<MAX_HP);
  const pool=[];
  const add=(t,w)=>{if(w>0&&funds[RED]>=UNIT_DEF[t].cost)for(let i=0;i<Math.round(w);i++)pool.push(t);};
  const candidates=["tank","htank","mech","inf","recon","art","heli","rocket","aa","bomber","medic"];
  for(const t of candidates){
    let w=2; // 基礎ウェイト
    if(blueTypes.length){
      // 現在の青軍構成に対する平均的な相性の良さでウェイトを補正
      let effSum=0;
      for(const bt of blueTypes)effSum+=UNIT_DEF[t].vs[UNIT_DEF[bt].cls]||0;
      const effAvg=effSum/blueTypes.length;
      w=Math.max(0.5,effAvg*3);
    }
    if(blueHasAir&&t==="aa")w+=5;
    if(t==="rocket"||t==="art")w*=0.8; // 間接火力は取り回しが悪いので少し控えめ
    if(t==="bomber"){
      // 高額な最強ユニット。資金にかなり余裕がある時だけ積極的に狙う
      w = funds[RED]>=UNIT_DEF.bomber.cost*1.3 ? 4 : 0.3;
    }
    if(t==="medic"){
      // 支援ユニット。負傷している味方がいる時は重視、いなくても少しは選ぶ
      w = redDamaged ? 1.5 : 0.6;
    }
    add(t,w);
  }
  if(!pool.length&&funds[RED]>=1000)pool.push("inf");
  return pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
}
function aiProduce(){
  if(ended)return;
  const spots=[];
  for(const k in owner){
    if(owner[k]!==RED)continue;
    const[x,y]=k.split(",").map(Number);
    const t=map[y][x];
    if((t===T.FACTORY||t===T.HQ)&&!unitAt(x,y))spots.push({x,y});
  }
  // 自軍(青)に近い工場ほど脅威に晒されやすいので優先的に埋める
  spots.sort((a,b)=>aiThreatLevel(b.x,b.y,BLUE)-aiThreatLevel(a.x,a.y,BLUE));
  // 時々「貯金ターン」にして、高額ユニット(爆撃機など)のために資金を温存する
  // (脅威度の高い工場は貯金中でも守るため、最低1つは稼働させる)
  const saving = Math.random()<0.35;
  const fillCount = saving ? Math.max(1,Math.ceil(spots.length*0.35)) : spots.length;
  for(let i=0;i<spots.length && i<fillCount;i++){
    const s=spots[i];
    const type=aiPickType();
    if(type){
      const cost=getPropLevel(s.x,s.y)>=1?Math.round(UNIT_DEF[type].cost*LV2_COST_MULT):UNIT_DEF[type].cost;
      funds[RED]-=cost;
      const nu=mkUnit(type,RED,s.x,s.y);nu.acted=true;units.push(nu);
      addPopup(s.x,s.y,"生産","#fff");
    }
  }
  setTimeout(()=>{if(!checkEnded())endTurn();},450);
}

==================================================== */
function checkEnded(){
  if(ended)return true;
  const blue=units.some(u=>u.pid===BLUE&&u.hp>0);
  const red=units.some(u=>u.pid===RED&&u.hp>0);
  // 敵(赤)はユニット0体になった瞬間に即敗北（従来通り・シンプルな勝利条件）
  if(!red){gameOver(BLUE);return true;}
  // 自軍(青)はユニット0体でも、工場かHQを1つでも持っていれば復活の目があるので即敗北にしない
  // （ユニット売却による資金繰りや、初期兵力0のステージで理不尽に負けないようにするため）
  const blueCanRebuild=hasProductionTile(BLUE);
  if(!blue&&!blueCanRebuild){gameOver(RED);return true;}
  return false;
}
function hasProductionTile(pid){
  for(const k in owner){
    if(owner[k]!==pid)continue;
    const[x,y]=k.split(",").map(Number);
    const t=map[y][x];
    if(t===T.FACTORY||t===T.HQ)return true;
  }
  return false;
}
function gameOver(winner){
  if(ended)return;ended=true;

  setTimeout(()=>{showEndDialog(winner);},900);
}

/* ====================================================
/* ====================================================
   入力（タップ／ピンチズーム／パン）
   ※ズームはCSS拡大ではなく、TILE自体を変更して再描画する
     （解像度が常にシャープなまま拡大・縮小される）
==================================================== */
let baseTile=36;
const REF_COLS=11, REF_ROWS=12; // 標準表示の基準（マップが何マスでもこの見た目サイズを保つ）
const TILE_MIN=18, TILE_MAX_MULT=3.2;
let camX=0, camY=0;
const pointers=new Map(); // pointerId -> {x,y}
let pinchPrev=null;       // {dist, mid}
let dragStart=null;       // {x,y,camX,camY,moved}
const TAP_SLOP=10; // px（これ以上動いたらタップ扱いしない）

function applyCam(){
  cv.style.transform=`translate(${camX}px,${camY}px)`;
}
function clampCam(){
  const wrap=document.getElementById("mapwrap");
  const ww=wrap.clientWidth, wh=wrap.clientHeight;
  const cw=TILE*COLS, ch=TILE*ROWS;
  if(cw>ww){camX=Math.max(ww-cw,Math.min(0,camX));}
  else{camX=(ww-cw)/2;}
  if(ch>wh){camY=Math.max(wh-ch,Math.min(0,camY));}
  else{camY=(wh-ch)/2;}
}
function setTileSize(newTile){
  newTile=Math.round(newTile);
  const wrap=document.getElementById("mapwrap");
  const maxT=Math.max(baseTile*TILE_MAX_MULT, baseTile+1);
  newTile=Math.max(TILE_MIN,Math.min(maxT,newTile));
  if(newTile===TILE)return false;
  TILE=newTile;
  cv.width=TILE*COLS*DPR;cv.height=TILE*ROWS*DPR;
  cv.style.width=TILE*COLS+"px";cv.style.height=TILE*ROWS+"px";
  terrCv.width=cv.width;terrCv.height=cv.height;
  terrainDirty=true;
  return true;
}
// 画面中心が指すマップ上の地点を維持したままタイルサイズを変える
function setTileSizeKeepingFocus(newTile,focalX,focalY){
  const oldTile=TILE;
  if(!setTileSize(newTile))return;
  const ratio=TILE/oldTile;
  camX=focalX-(focalX-camX)*ratio;
  camY=focalY-(focalY-camY)*ratio;
}
function centerCameraOnTile(tx,ty){
  const wrap=document.getElementById("mapwrap");
  const ww=wrap.clientWidth, wh=wrap.clientHeight;
  camX=ww/2-(tx+0.5)*TILE;
  camY=wh/2-(ty+0.5)*TILE;
  clampCam();
}
function resetCam(){
  const wrap=document.getElementById("mapwrap");
  baseTile=Math.floor(Math.min(wrap.clientWidth/REF_COLS, wrap.clientHeight/REF_ROWS));
  baseTile=Math.max(20,Math.min(56,baseTile));
  TILE=0; // 強制的にsetTileSizeで再構築させる
  setTileSize(baseTile);
  const hq=(HQ_POS&&HQ_POS[0])?HQ_POS[0]:{x:Math.floor(COLS/2),y:ROWS-1};
  centerCameraOnTile(hq.x,hq.y);
  applyCam();
}
function dist2(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function mid2(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2};}

cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    const p=[...pointers.values()][0];
    dragStart={x:p.x,y:p.y,camX,camY,moved:false};
    pinchPrev=null;
  }else if(pointers.size===2){
    const[a,b]=[...pointers.values()];
    pinchPrev={dist:dist2(a,b),mid:mid2(a,b)};
    dragStart=null;
  }
});
cv.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2&&pinchPrev){
    const[a,b]=[...pointers.values()];
    const nd=dist2(a,b), nm=mid2(a,b);
    const wrap=document.getElementById("mapwrap").getBoundingClientRect();
    const localX=pinchPrev.mid.x-wrap.left, localY=pinchPrev.mid.y-wrap.top;
    const desired=TILE*(nd/Math.max(1,pinchPrev.dist));
    setTileSizeKeepingFocus(desired,localX,localY);
    // 指の中点そのものの移動分も平行移動として加える
    camX+=(nm.x-pinchPrev.mid.x);
    camY+=(nm.y-pinchPrev.mid.y);
    clampCam();
    applyCam();
    pinchPrev={dist:nd,mid:nm};
  }else if(pointers.size===1&&dragStart){
    const p=[...pointers.values()][0];
    const dx=p.x-dragStart.x, dy=p.y-dragStart.y;
    if(Math.hypot(dx,dy)>TAP_SLOP)dragStart.moved=true;
    const wrap=document.getElementById("mapwrap");
    const overflow=(TILE*COLS>wrap.clientWidth)||(TILE*ROWS>wrap.clientHeight);
    if(overflow){ // マップが画面より大きい時のみ1本指パンが効く
      camX=dragStart.camX+dx;
      camY=dragStart.camY+dy;
      clampCam();
      applyCam();
    }
  }
});
function endPointer(e){
  const wasSingle=pointers.size===1;
  const ds=dragStart;
  pointers.delete(e.pointerId);
  if(pointers.size===0){
    if(wasSingle&&ds&&!ds.moved&&!busy()){
      const r=cv.getBoundingClientRect();
      const x=Math.floor((e.clientX-r.left)/r.width*COLS);
      const y=Math.floor((e.clientY-r.top)/r.height*ROWS);
      if(x>=0&&y>=0&&x<COLS&&y<ROWS)handleTap(x,y);
    }
    dragStart=null;pinchPrev=null;
  }else if(pointers.size===1){
    // 2本指→1本指に減った：残った指でパン継続できるようにする
    const p=[...pointers.values()][0];
    dragStart={x:p.x,y:p.y,camX,camY,moved:true};
    pinchPrev=null;
  }
}
cv.addEventListener("pointerup",endPointer);
cv.addEventListener("pointercancel",endPointer);
function terrainLine(u){
  const ti=TERRAIN_INFO[map[u.y][u.x]];
  const o=getOwner(u.x,u.y);
  if(UNIT_DEF[u.type].cls==="air")
    return`📍${ti.name}（飛行中は地形効果なし）`;
  let s=`📍${ti.name}　防御★${ti.def}`;
  if(o!==null)s+=`（${PLAYER_NAME[o]}領）`;
  if(getPropLevel(u.x,u.y)>=1)s+=` <span style="color:#ffd76a">🏗Lv.2</span>`;
  return s;
}
function handleTap(x,y){
  if(mode==="attack"){
    const t=attackTargets.find(u=>u.x===x&&u.y===y);
    if(t){
      const u=sel.unit;
      mode="anim";setBtns([]);
      performAttack(u,t,msg=>{u.acted=true;finishAction(msg);});
    }else{SND.cancel();}
    return;
  }
  if(mode==="heal"){
    const t=attackTargets.find(u=>u.x===x&&u.y===y);
    if(t){mode="anim";setBtns([]);doHeal(sel.unit,t);}
    else{SND.cancel();}
    return;
  }
  if(mode==="acted"||mode==="mergeAsk"){
    // 行動前なら他のユニットをタップして選び直せる（移動は取り消し）
    const u2=unitAt(x,y);
    if(u2&&u2.pid===BLUE&&!u2.acted){
      undoPending();
      selectUnit(u2);
    }else SND.cancel();
    return;
  }
  if(mode==="move"&&moveData&&moveData.reach.has(key(x,y))){
    const u=sel.unit;
    const ox=u.x,oy=u.y;
    const k=key(x,y);
    if(moveData.merge.has(k)){
      // 合流は確認してから（誤タップ防止）
      const target=unitAt(x,y);
      const path=buildPath(moveData,k);
      sel={unit:u,ox,oy};moveData=null;mode="mergeAsk";
      updateUI(`🤝 <b>${UNIT_DEF[u.type].name}</b>を合流させますか？<br><small>（HPを合わせて回復／合流後は行動済みになります）</small>`);
      setBtns([
        {label:"🤝 合流する",gold:true,fn:()=>{
          mode="anim";setBtns([]);
          u.x=x;u.y=y;
          animateMove(u,path,()=>doMerge(u,target));
        }},
        {label:"やめる",fn:()=>{SND.cancel();cancelSel();}},
      ]);
      return;
    }
    const moved=k!==moveData.origin;
    const path=buildPath(moveData,k);
    u.x=x;u.y=y;
    mode="anim";setBtns([]);
    animateMove(u,path,()=>afterMove(u,moved,ox,oy));
    return;
  }
  const u=unitAt(x,y);
  if(u&&u.pid===BLUE&&!u.acted){
    selectUnit(u);
  }else if(u&&u.pid===RED){
    SND.select();
    cancelSel();
    const ud=UNIT_DEF[u.type];
    const stars=u.rank?` <span style="color:#ffd76a">${"★".repeat(u.rank)}</span>`:"";
    const rngTxt=isIndirect(u)?`／射程${ud.range[0]}-${ud.range[1]}`:"";
    updateUI(`<img src="${sprUrl[u.type][RED]}">
      <span><b style="color:#ff8a92">敵${ud.name}</b>${stars} HP${u.hp}/${MAX_HP}　攻撃${effAtk(u)}${rngTxt}／移動${ud.move}<br>
      <small>${ud.desc}　${terrainLine(u)}</small></span>`);
  }else{
    cancelSel();
    const t=map[y][x];const ti=TERRAIN_INFO[t];
    let html=`<span><b>${ti.name}</b>　防御 ★${ti.def}`;
    const o=getOwner(x,y);
    if(o!==null)html+=`（${PLAYER_NAME[o]}領）`;
    if(isProp(t)){
      const lvl=getPropLevel(x,y);
      if(lvl>=1){
        html+=` <b style="color:#ffd76a">🏗Lv.2</b>`;
        html+=`<br><small>回復+${LV2_HEAL}／防御+${LV2_DEF_BONUS}`+
          ((t===T.FACTORY||t===T.HQ)?`／生産費${Math.round((1-LV2_COST_MULT)*100)}%引き`:"")+"</small>";
      }else{
        const dp=developProgress[key(x,y)];
        if(dp)html+=`<br><small style="color:#9ad6ff">開発中… ${dp.amount}/${DEVELOP_NEED}</small>`;
      }
      const cp=captureProgress[key(x,y)];
      if(cp)html+=`<br><small style="color:#ffd76a">占領進行中… ${cp.amount}/${CAPTURE_NEED}（${PLAYER_NAME[cp.pid]}）</small>`;
    }
    html+="</span>";
    updateUI(html);
    if((t===T.FACTORY||t===T.HQ)&&o===BLUE&&!unitAt(x,y)){
      openProduce(x,y);
    }
  }
}
const SELL_REFUND_RATE=0.5; // 売却で戻ってくる割合（コストの半額）
function sellUnit(u){
  const refund=Math.round(UNIT_DEF[u.type].cost*SELL_REFUND_RATE);
  funds[BLUE]+=refund;
  u.hp=0;
  const idx=units.indexOf(u);
  if(idx>=0)units.splice(idx,1);
  SND.coin();
  addPopup(u.px,u.py,"+"+refund+"G","#ffd76a");
  updateTop();
  cancelSel();
  updateUI(UNIT_DEF[u.type].name+"を売却し、"+refund+"G獲得しました");
  autosave();
}
function trySellUnit(u){
  const refund=Math.round(UNIT_DEF[u.type].cost*SELL_REFUND_RATE);
  if(confirm(UNIT_DEF[u.type].name+"を売却しますか？\n+"+refund+"G獲得（元には戻せません）"))
    sellUnit(u);
}
function selectUnit(u){
  SND.select();
  sel={unit:u};mode="move";moveData=calcMove(u);
  const ud=UNIT_DEF[u.type];
  const rk=RANKS[u.rank],next=RANKS[u.rank+1];
  const stars=u.rank?` <span style="color:#ffd76a">${"★".repeat(u.rank)}</span>`:"";
  const rngTxt=isIndirect(u)?`／射程${ud.range[0]}-${ud.range[1]}`:"";
  updateUI(`<img src="${sprUrl[u.type][BLUE]}">
    <span><b>${ud.name}</b>${stars} HP${u.hp}/${MAX_HP}　攻撃${effAtk(u)}${rngTxt}／移動${ud.move}<br>
    <small>${rk.name}　EXP ${u.exp}${next?`（次まで${next.exp-u.exp}）`:"（最高）"}　${terrainLine(u)}</small></span>`);
  setBtns([{label:"ここで行動",fn:()=>{mode="anim";afterMove(u,false,u.x,u.y);}},
           {label:"💰 売却",fn:()=>trySellUnit(u)},
           {label:"選択解除",fn:cancelSel}]);
}
function undoPending(){
  if(sel&&sel.unit&&sel.ox!==undefined){
    const u=sel.unit;
    u.x=sel.ox;u.y=sel.oy;u.px=sel.ox;u.py=sel.oy;
  }
  sel=null;moveData=null;attackTargets=[];mode="idle";setBtns([]);
}
function animateMove(u,path,after){
  if(path.length<2){u.px=u.x;u.py=u.y;after&&after();return;}
  const steps=[];
  for(let i=1;i<path.length;i++){
    const a=path[i-1],b=path[i];
    steps.push({dur:105,onStart:()=>SND.step(),
      update:p=>{u.px=a.x+(b.x-a.x)*p;u.py=a.y+(b.y-a.y)*p;}});
  }
  pushAnim(steps,()=>{u.px=u.x;u.py=u.y;after&&after();});
}
function afterMove(u,moved,ox,oy){
  sel={unit:u,ox,oy,moved};moveData=null;
  const canFire=!isIndirect(u)||!moved;
  attackTargets=canFire?enemiesInRange(u):[];
  const cap=canCaptureHere(u);
  const heals=healTargets(u);
  const canDev=canDevelopHere(u);
  const canMine=canMineHere(u);
  const btns=[];
  if(attackTargets.length)btns.push({label:"⚔️ 攻撃",warn:true,fn:()=>{
    mode="attack";updateUI("攻撃する敵（赤色のマス）をタップ");
    setBtns([{label:"やめる",fn:()=>{afterMove(u,moved,ox,oy);}}]);}});
  if(heals.length)btns.push({label:"💚 回復",gold:true,fn:()=>{
    if(heals.length===1){doHeal(u,heals[0]);return;}
    mode="heal";attackTargets=heals;updateUI("回復する味方（緑色のマス）をタップ");
    setBtns([{label:"やめる",fn:()=>{afterMove(u,moved,ox,oy);}}]);}});
  if(cap)btns.push({label:"🚩 占領",gold:true,fn:()=>{
    const m=tryCapture(u);u.acted=true;finishAction(m||"");}});
  if(canDev)btns.push({label:"🏗 開発",gold:true,fn:()=>{
    const m=tryDevelop(u);u.acted=true;finishAction(m||"");}});
  if(canMine)btns.push({label:"⛏ 発掘",gold:true,fn:()=>{
    const m=tryMine(u);finishAction(m||"");}});
  btns.push({label:"待機",fn:()=>{u.acted=true;finishAction("待機しました");}});
  btns.push({label:moved?"↩ 戻る":"やめる",fn:()=>{
    u.x=ox;u.y=oy;u.px=ox;u.py=oy;SND.cancel();cancelSel();}});
  mode="acted";
  let hint="行動を選んでください <small>（他のユニットをタップで選び直しOK）</small>";
  if(isIndirect(u)&&moved)hint+="<br><small>（移動したターンは砲撃できません）</small>";
  updateUI(hint);
  setBtns(btns);
}
function canCaptureHere(u){
  const t=map[u.y][u.x];
  return UNIT_DEF[u.type].canCapture&&isProp(t)&&getOwner(u.x,u.y)!==u.pid;
}
// 救急隊：隣接する負傷した味方（自分以外）を探す
function healTargets(u){
  if(!UNIT_DEF[u.type].heal)return [];
  const out=[];
  for(const[dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const t=unitAt(u.x+dx,u.y+dy);
    if(t&&t!==u&&t.pid===u.pid&&t.hp<MAX_HP)out.push(t);
  }
  return out;
}
function doHeal(medic,target){
  const amt=Math.min(UNIT_DEF[medic.type].heal,MAX_HP-target.hp);
  target.hp+=amt;
  target.flash=1;
  SND.heal();
  addPopup(target.x,target.y,"+"+amt,"#7fe08a");
  rings.push({x:target.x+.5,y:target.y+.5,r:.12,life:1,color:"#7fe08a"});
  for(let i=0;i<10;i++){
    const ang=Math.random()*6.28,sp=.4+Math.random()*1.2;
    particles.push({x:target.x+.5,y:target.y+.5,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-1,
      life:.5+Math.random()*.3,maxLife:1,size:.06+Math.random()*.08,color:"#7fe08a"});
  }
  medic.acted=true;
  finishAction(UNIT_DEF[target.type].name+"を"+amt+"回復しました");
}
function finishAction(msg){
  sel=null;mode="idle";moveData=null;attackTargets=[];
  updateUI(msg);setBtns([]);updateTop();
  if(ended)return;
  if(checkEnded())return;
  autosave();
  const remain=units.filter(u=>u.pid===BLUE&&u.hp>0&&!u.acted).length;
  if(remain===0)updateUI(msg+"<br><small>全ユニット行動済み。「ターン終了」を押してください</small>");
}
function cancelSel(){sel=null;mode="idle";moveData=null;attackTargets=[];
  setBtns([]);updateUI("マスをタップしてください");}
function goHome(){
  bgmStop();
  ended=true;
  anims=[];particles=[];popups=[];rings=[];
  sel=null;mode="idle";moveData=null;attackTargets=[];
  setBtns([]);
  openStageSelect(false);
}

function openProduce(x,y){
  const d=document.getElementById("dialog");
  const lv2=getPropLevel(x,y)>=1;
  const propName=TERRAIN_INFO[map[y][x]].name;
  let html=`<h2>ユニット生産${lv2?`　<small style="color:#ffd76a">🏗Lv.2${propName}（生産費20%引き）</small>`:''}</h2>
    <p style="text-align:center;margin-bottom:8px">資金：💰${funds[BLUE]}G</p><div class="row">`;
  for(const k in UNIT_DEF){
    const ud=UNIT_DEF[k];
    const cost=lv2?Math.round(ud.cost*LV2_COST_MULT):ud.cost;
    const dis=funds[BLUE]<cost?"disabled":"";
    html+=`<button ${dis} onclick="produce('${k}',${x},${y})">
      <img src="${sprUrl[k][BLUE]}">
      <span>${ud.name}<br><small>${ud.desc}</small></span>
      <span class="pr">${cost}G${lv2?'<br><small style="text-decoration:line-through;opacity:.6">'+ud.cost+'G</small>':''}</span></button>`;
  }
  html+=`<button class="warn center" onclick="closeOverlay()">やめる</button></div>`;
  d.innerHTML=html;
  document.getElementById("overlay").classList.remove("hidden");
}
function produce(type,x,y){
  const cost=getPropLevel(x,y)>=1?Math.round(UNIT_DEF[type].cost*LV2_COST_MULT):UNIT_DEF[type].cost;
  funds[BLUE]-=cost;
  const u=mkUnit(type,BLUE,x,y);u.acted=true;u.flash=1;units.push(u);
  SND.coin();
  addPopup(x,y,"生産！","#7dff9a");
  closeOverlay();updateTop();
  updateUI(UNIT_DEF[type].name+"を生産しました（次のターンから行動できます）");
  autosave();
}
function closeOverlay(){document.getElementById("overlay").classList.add("hidden");overlayClosable=false;}

function updateTop(){
  const tb=document.getElementById("turnbadge");
  tb.textContent=`S${currentStage+1} DAY ${turnCount}　${PLAYER_NAME[turn]}`;
  tb.style.background=PLAYER_COLOR[turn];
  document.getElementById("funds").textContent=funds[BLUE];
  let p=0;for(const k in owner)if(owner[k]===BLUE)p++;
  document.getElementById("props").textContent=p;
}
function updateUI(html){document.getElementById("info").innerHTML=html;}
function setBtns(list){
  const b=document.getElementById("btns");b.innerHTML="";
  for(const it of list){
    const btn=document.createElement("button");
    btn.textContent=it.label;
    if(it.warn)btn.className="warn";
    if(it.gold)btn.className="gold";
    btn.onclick=()=>{if(!ended)it.fn();};
    b.appendChild(btn);
  }
  const end=document.createElement("button");
  end.textContent="ターン終了";end.className="warn";
  end.onclick=()=>{
    if(busy())return;
    const remain=units.filter(u=>u.pid===BLUE&&u.hp>0&&!u.acted).length;
    if(remain>0){
      if(!confirm("まだ行動していない味方が "+remain+" 部隊います。\nこのままターンを終了しますか？"))return;
    }
    endTurn();
  };
  b.appendChild(end);
}

function resize(){

  resetCam();
}

function rseed(x,y){let n=x*374761393+y*668265263;
  n=(n^(n>>13))*1274126177;return((n^(n>>16))>>>0)/4294967295;}
function inMap(x,y){return x>=0&&y>=0&&x<COLS&&y<ROWS;}
function tileAt(x,y){return inMap(x,y)?map[y][x]:-1;}

const STAGE_PAL=[0,2,1,3,0, 1,2,0,3,3];

function applyPalette(idx){
  PAL=PALS[STAGE_PAL[idx]!==undefined?STAGE_PAL[idx]:0];
  const w=document.getElementById("mapwrap");
  if(w)w.style.background=
    `radial-gradient(ellipse at 50% 30%, ${PAL.sky[0]} 0%, ${PAL.sky[1]} 80%)`;
  terrainDirty=true;
}

function renderTerrain(){
  const g=terrCv.getContext("2d");
  g.setTransform(DPR,0,0,DPR,0,0);
  g.imageSmoothingEnabled=false;
  waterTiles=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const t=map[y][x];
    const px=x*TILE,py=y*TILE,S=TILE;
    if(t===T.RIVER){
      waterTiles.push([x,y]);
      g.fillStyle=(x+y)%2===0?PAL.waterA:PAL.waterB;
      g.fillRect(px,py,S,S);
      g.fillStyle=PAL.waterHi;
      for(let i=0;i<3;i++){
        const r1=rseed(x*5+i,y*3),r2=rseed(x*2,y*7+i);
        g.fillRect(px+r1*(S-8)+2,py+r2*(S-6)+3,S*.2,2);
      }
      g.fillStyle=PAL.waterEdge;
      if(tileAt(x,y-1)!==T.RIVER)g.fillRect(px,py,S,2);
      if(tileAt(x,y+1)!==T.RIVER)g.fillRect(px,py+S-2,S,2);
      if(tileAt(x-1,y)!==T.RIVER)g.fillRect(px,py,2,S);
      if(tileAt(x+1,y)!==T.RIVER)g.fillRect(px+S-2,py,2,S);
      continue;
    }
    g.fillStyle=(x+y)%2===0?PAL.plainA:PAL.plainB;
    g.fillRect(px,py,S,S);
    for(let i=0;i<3;i++){
      const r1=rseed(x*3+i,y),r2=rseed(x,y*3+i);
      if(rseed(x+i,y+i)<.6){
        g.fillStyle=PAL.dot;
        g.fillRect(px+r1*(S-4)+1,py+r2*(S-4)+1,2,2);
      }
    }
    if(t===T.ROAD){
      const isRiv=(dx,dy)=>tileAt(x+dx,y+dy)===T.RIVER;
      const vBridge=isRiv(-1,0)&&isRiv(1,0);
      const hBridge=isRiv(0,-1)&&isRiv(0,1);
      if(vBridge||hBridge){
        g.fillStyle=PAL.waterA;g.fillRect(px,py,S,S);
        g.fillStyle=PAL.bridge;
        if(vBridge){g.fillRect(px+S*.18,py,S*.64,S);
          g.fillStyle=PAL.bridgeEdge;
          g.fillRect(px+S*.18,py,3,S);g.fillRect(px+S*.82-3,py,3,S);}
        else{g.fillRect(px,py+S*.18,S,S*.64);
          g.fillStyle=PAL.bridgeEdge;
          g.fillRect(px,py+S*.18,S,3);g.fillRect(px,py+S*.82-3,S,3);}
      }else{
        const conn=(dx,dy)=>{const nt=tileAt(x+dx,y+dy);
          return nt===T.ROAD||isProp(nt);};
        g.fillStyle=PAL.road;
        const w=S*.46,o=(S-w)/2;
        g.fillRect(px+o,py+o,w,w);
        if(conn(1,0))g.fillRect(px+o,py+o,S-o,w);
        if(conn(-1,0))g.fillRect(px,py+o,o+w,w);
        if(conn(0,1))g.fillRect(px+o,py+o,w,S-o);
        if(conn(0,-1))g.fillRect(px+o,py,w,o+w);
        g.fillStyle=PAL.roadDot;
        const horiz=conn(1,0)||conn(-1,0), vert=conn(0,1)||conn(0,-1);
        if(horiz&&!vert){ // 横方向の破線
          g.fillRect(px+S*.10,py+S*.47,S*.16,S*.07);
          g.fillRect(px+S*.42,py+S*.47,S*.16,S*.07);
          g.fillRect(px+S*.74,py+S*.47,S*.16,S*.07);
        }else if(vert&&!horiz){ // 縦方向の破線
          g.fillRect(px+S*.47,py+S*.10,S*.07,S*.16);
          g.fillRect(px+S*.47,py+S*.42,S*.07,S*.16);
          g.fillRect(px+S*.47,py+S*.74,S*.07,S*.16);
        }else{
          g.fillRect(px+S*.44,py+S*.44,S*.12,S*.12);
        }
      }
    }else if(t===T.FOREST){
      drawTree(g,px+S*.14,py+S*.1,S*.5);
      drawTree(g,px+S*.42,py+S*.32,S*.55);
    }else if(t===T.MTN){
      g.fillStyle="rgba(0,0,0,.15)";
      g.beginPath();g.ellipse(px+S*.5,py+S*.85,S*.38,S*.1,0,0,7);g.fill();
      g.fillStyle=PAL.mtnD;
      g.beginPath();g.moveTo(px+S*.5,py+S*.1);
      g.lineTo(px+S*.92,py+S*.86);g.lineTo(px+S*.08,py+S*.86);
      g.closePath();g.fill();
      g.fillStyle=PAL.mtnL;
      g.beginPath();g.moveTo(px+S*.5,py+S*.1);
      g.lineTo(px+S*.92,py+S*.86);g.lineTo(px+S*.5,py+S*.86);
      g.closePath();g.fill();
      g.fillStyle=PAL.snow;
      g.beginPath();g.moveTo(px+S*.5,py+S*.1);
      g.lineTo(px+S*.64,py+S*.36);g.lineTo(px+S*.5,py+S*.3);
      g.lineTo(px+S*.38,py+S*.37);g.closePath();g.fill();
    }else if(isProp(t)){
      drawBuilding(g,px,py,S,t,getOwner(x,y),getPropLevel(x,y));
    }
  }
}
function drawTree(g,x,y,s){
  g.fillStyle="rgba(0,0,0,.18)";
  g.beginPath();g.ellipse(x+s*.5,y+s*.95,s*.4,s*.12,0,0,7);g.fill();
  g.fillStyle=PAL.trunk;
  g.fillRect(x+s*.42,y+s*.6,s*.16,s*.35);
  g.fillStyle=PAL.treeD;
  g.beginPath();g.moveTo(x+s*.5,y);
  g.lineTo(x+s,y+s*.55);g.lineTo(x,y+s*.55);g.closePath();g.fill();
  g.fillStyle=PAL.treeL;
  g.beginPath();g.moveTo(x+s*.5,y+s*.12);
  g.lineTo(x+s*.82,y+s*.5);g.lineTo(x+s*.18,y+s*.5);g.closePath();g.fill();
}
function drawBuilding(g,px,py,S,t,o,lvl){
  const main=o===null?"#969cad":PLAYER_COLOR[o];
  const dark=o===null?"#6a7080":PLAYER_DARK[o];
  const lv2=lvl>=1;
  g.fillStyle="rgba(0,0,0,.2)";
  g.fillRect(px+S*.12,py+S*.82,S*.76,S*.1);
  if(t===T.CITY){
    if(lv2){
      // Lv2：高層ビルが増築され、窓が輝く近未来的な都市に
      g.fillStyle="#c2c8d6";
      g.fillRect(px+S*.14,py+S*.16,S*.6,S*.7);
      g.fillStyle="#d6d9e2";
      g.fillRect(px+S*.42,py+S*.02,S*.4,S*.84);
      g.fillStyle=main;
      g.fillRect(px+S*.1,py+S*.06,S*.78,S*.12);
      g.fillStyle="#ffe9a0";
      for(let i=0;i<3;i++)g.fillRect(px+S*(.2+i*.14),py+S*.32,S*.08,S*.1);
      for(let i=0;i<2;i++)g.fillRect(px+S*(.48+i*.14),py+S*.12,S*.08,S*.1);
      for(let i=0;i<2;i++)g.fillRect(px+S*(.48+i*.14),py+S*.3,S*.08,S*.1);
      g.fillStyle="#4a5168";
      g.fillRect(px+S*.4,py+S*.68,S*.2,S*.18);
      g.fillStyle="#ffd76a";
      g.fillRect(px+S*.1,py+S*.16,S*.78,S*.025);
    }else{
      g.fillStyle="#d6d9e2";
      g.fillRect(px+S*.18,py+S*.34,S*.64,S*.52);
      g.fillStyle=main;
      g.fillRect(px+S*.12,py+S*.2,S*.76,S*.18);
      g.fillStyle="#4a5168";
      for(let i=0;i<3;i++)g.fillRect(px+S*(.26+i*.18),py+S*.48,S*.1,S*.12);
      g.fillStyle="#ffd76a";
      g.fillRect(px+S*.44,py+S*.48,S*.1,S*.12);
      g.fillStyle="#4a5168";
      g.fillRect(px+S*.42,py+S*.68,S*.16,S*.18);
    }
  }else if(t===T.FACTORY){
    if(lv2){
      // Lv2：煙突が2本に増え、炉が輝く大規模工場に
      g.fillStyle="#b8bdc9";
      g.fillRect(px+S*.1,py+S*.38,S*.8,S*.48);
      g.fillStyle=dark;
      g.beginPath();g.moveTo(px+S*.1,py+S*.38);
      g.lineTo(px+S*.3,py+S*.22);g.lineTo(px+S*.3,py+S*.38);
      g.lineTo(px+S*.5,py+S*.22);g.lineTo(px+S*.5,py+S*.38);
      g.lineTo(px+S*.7,py+S*.22);g.lineTo(px+S*.7,py+S*.38);
      g.lineTo(px+S*.9,py+S*.22);g.lineTo(px+S*.9,py+S*.38);
      g.closePath();g.fill();
      g.fillStyle="#5a6070";
      g.fillRect(px+S*.16,py+S*.06,S*.11,S*.32);
      g.fillRect(px+S*.68,py+S*.1,S*.11,S*.28);
      g.fillStyle="#ff9a5a";
      g.beginPath();g.arc(px+S*.215,py+S*.06,S*.045,0,7);g.fill();
      g.beginPath();g.arc(px+S*.735,py+S*.1,S*.04,0,7);g.fill();
      g.fillStyle=main;
      g.fillRect(px+S*.1,py+S*.58,S*.8,S*.11);
      g.fillStyle="#ffe9a0";
      g.fillRect(px+S*.2,py+S*.74,S*.1,S*.08);
      g.fillRect(px+S*.4,py+S*.74,S*.1,S*.08);
      g.fillRect(px+S*.6,py+S*.74,S*.1,S*.08);
    }else{
      g.fillStyle="#b8bdc9";
      g.fillRect(px+S*.14,py+S*.42,S*.72,S*.44);
      g.fillStyle=dark;
      g.beginPath();g.moveTo(px+S*.14,py+S*.42);
      g.lineTo(px+S*.38,py+S*.26);g.lineTo(px+S*.38,py+S*.42);
      g.lineTo(px+S*.62,py+S*.26);g.lineTo(px+S*.62,py+S*.42);
      g.lineTo(px+S*.86,py+S*.26);g.lineTo(px+S*.86,py+S*.42);
      g.closePath();g.fill();
      g.fillStyle="#6a7080";
      g.fillRect(px+S*.2,py+S*.14,S*.12,S*.28);
      g.fillStyle=main;
      g.fillRect(px+S*.14,py+S*.6,S*.72,S*.1);
    }
  }else{
    if(lv2){
      // Lv2：本拠地が要塞化。土台が広がり、旗が大きく豪華に
      g.fillStyle=dark;
      g.fillRect(px+S*.08,py+S*.5,S*.84,S*.36);
      g.fillStyle=main;
      g.fillRect(px+S*.12,py+S*.28,S*.76,S*.46);
      g.fillStyle=dark;
      g.fillRect(px+S*.12,py+S*.28,S*.76,S*.09);
      g.fillStyle="#ffe9a0";
      g.fillRect(px+S*.2,py+S*.62,S*.12,S*.24);
      g.fillRect(px+S*.68,py+S*.62,S*.12,S*.24);
      g.fillStyle="#fff";
      g.fillRect(px+S*.42,py+S*.56,S*.16,S*.3);
      g.fillStyle="#3a3f55";
      g.fillRect(px+S*.45,py-S*.02,S*.06,S*.42);
      g.fillStyle="#ffd76a";
      g.beginPath();g.moveTo(px+S*.51,py-S*.02);
      g.lineTo(px+S*.92,py+S*.1);g.lineTo(px+S*.51,py+S*.22);
      g.closePath();g.fill();
      g.strokeStyle="#3a2c00";g.lineWidth=Math.max(1,S*.01);
      g.beginPath();g.moveTo(px+S*.51,py-S*.02);
      g.lineTo(px+S*.92,py+S*.1);g.lineTo(px+S*.51,py+S*.22);
      g.closePath();g.stroke();
    }else{
      g.fillStyle=main;
      g.fillRect(px+S*.16,py+S*.36,S*.68,S*.5);
      g.fillStyle=dark;
      g.fillRect(px+S*.16,py+S*.36,S*.68,S*.1);
      g.fillStyle="#fff";
      g.fillRect(px+S*.42,py+S*.6,S*.16,S*.26);
      g.fillStyle="#3a3f55";
      g.fillRect(px+S*.46,py+S*.04,S*.05,S*.34);
      g.fillStyle=main;
      g.beginPath();g.moveTo(px+S*.51,py+S*.06);
      g.lineTo(px+S*.82,py+S*.14);g.lineTo(px+S*.51,py+S*.24);
      g.closePath();g.fill();
      g.fillStyle="#ffd76a";
      drawStar(g,px+S*.5,py+S*.48,S*.1);
    }
  }
}
function drawStar(g,cx,cy,r){
  g.beginPath();
  for(let i=0;i<10;i++){
    const ang=-Math.PI/2+i*Math.PI/5;
    const rr=i%2===0?r:r*.45;
    g.lineTo(cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr);
  }
  g.closePath();g.fill();
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,TILE*COLS,TILE*ROWS);
  if(terrainDirty){renderTerrain();terrainDirty=false;}
  let sx=0,sy=0;
  if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;}
  ctx.save();
  ctx.translate(sx,sy);
  ctx.drawImage(terrCv,0,0,TILE*COLS,TILE*ROWS);
  // 水面の流れる光（パフォーマンス: タイル毎に細い光帯1本）
  if(waterTiles.length){
    const tt=timeNow/900;
    for(const[wx,wy] of waterTiles){
      const ph=(wx*0.37+wy*0.61)%1;
      const off=(tt+ph)%1;
      const a=.05+.07*Math.sin((tt*6.28)+ph*6.28);
      ctx.globalAlpha=Math.max(0,a);
      ctx.fillStyle="#ffffff";
      ctx.fillRect(wx*TILE+2, wy*TILE+off*(TILE-3), TILE-4, 2);
    }
    ctx.globalAlpha=1;
  }
  for(const k in captureProgress){
    const[x,y]=k.split(",").map(Number);
    const cp=captureProgress[k];
    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.fillRect(x*TILE+3,y*TILE+TILE-7,TILE-6,5);
    ctx.fillStyle="#ffd76a";
    ctx.fillRect(x*TILE+3,y*TILE+TILE-7,(TILE-6)*Math.min(1,cp.amount/CAPTURE_NEED),5);
  }
  if(moveData&&mode==="move"){
    const pulse=.3+.12*Math.sin(timeNow/220);
    for(const k of moveData.reach){
      const[x,y]=k.split(",").map(Number);
      if(moveData.merge.has(k)){
        ctx.fillStyle=`rgba(110,255,150,${pulse+.1})`;
        ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
        ctx.fillStyle="#fff";
        ctx.font="bold "+Math.floor(TILE*.4)+"px sans-serif";
        ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.fillText("＋",x*TILE+TILE/2,y*TILE+TILE*.28);
      }else{
        ctx.fillStyle=`rgba(90,170,255,${pulse})`;
        ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
        ctx.strokeStyle="rgba(150,210,255,.7)";
        ctx.strokeRect(x*TILE+1.5,y*TILE+1.5,TILE-3,TILE-3);
      }
    }
  }
  if(mode==="attack"){
    const pulse=.35+.18*Math.sin(timeNow/140);
    ctx.fillStyle=`rgba(255,70,70,${pulse})`;
    for(const u of attackTargets)
      ctx.fillRect(u.x*TILE,u.y*TILE,TILE,TILE);
  }
  if(mode==="heal"){
    const pulse=.35+.18*Math.sin(timeNow/140);
    ctx.fillStyle=`rgba(90,220,130,${pulse})`;
    for(const u of attackTargets)
      ctx.fillRect(u.x*TILE,u.y*TILE,TILE,TILE);
  }
  const sorted=[...units].sort((a,b)=>a.py-b.py);
  for(const u of sorted){
    if(u.hp<=0)continue;
    const isAir=UNIT_DEF[u.type].cls==="air";
    const cx=u.px*TILE+TILE/2,cy=u.py*TILE+TILE/2;
    ctx.fillStyle=isAir?"rgba(0,0,0,.18)":"rgba(0,0,0,.28)";
    ctx.beginPath();ctx.ellipse(cx,cy+TILE*.36,TILE*.28,TILE*.08,0,0,7);ctx.fill();
    const spc=sprCv[u.type][u.pid];
    const w=TILE*.92,h=w*(spc.height/spc.width);
    if(u.rank===5){
      const pulse=.5+.5*Math.sin(timeNow/220+u.x*3+u.y*1.7);
      const auraR=TILE*(.62+.09*pulse);
      const grad=ctx.createRadialGradient(cx,cy,TILE*.08,cx,cy,auraR);
      grad.addColorStop(0,`rgba(255,205,80,${.40+.18*pulse})`);
      grad.addColorStop(.7,`rgba(255,170,40,${.16+.08*pulse})`);
      grad.addColorStop(1,"rgba(255,170,40,0)");
      ctx.globalCompositeOperation="lighter";
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(cx,cy,auraR,0,7);ctx.fill();
      ctx.globalCompositeOperation="source-over";
    }
    const bob=(u.pid===turn&&!u.acted&&anims.length===0)
      ?Math.sin(timeNow/260+u.x*2)*TILE*.025:0;
    const airLift=isAir?-TILE*.16+Math.sin(timeNow/300+u.x)*TILE*.03:0;
    const grey=u.acted&&u.pid===turn;
    ctx.globalAlpha=grey?.55:1;
    ctx.drawImage(spc,cx-w/2,cy-h/2-TILE*.06+bob+airLift,w,h);
    ctx.globalAlpha=1;
    if(u.flash>0){
      ctx.globalCompositeOperation="lighter";
      ctx.fillStyle=`rgba(255,255,255,${u.flash*.85})`;
      ctx.fillRect(cx-w/2,cy-h/2-TILE*.06+airLift,w,h);
      ctx.globalCompositeOperation="source-over";
    }
    if(u.rank>0){
      const special=u.rank===5;
      const ss=special?TILE*.082:TILE*.105;
      const sparkle=special?(.75+.25*Math.sin(timeNow/150)):1;
      const gap=special?ss*1.9:ss*2.1;
      for(let i=0;i<u.rank;i++){
        const sx2=u.px*TILE+ss+2+i*gap,sy2=u.py*TILE+ss+2;
        const sz=special?ss*1.3*sparkle:ss;
        ctx.fillStyle="#3a2c00";drawStar(ctx,sx2,sy2,sz+1.3);
        ctx.fillStyle=special?"#fff1b8":"#ffd76a";drawStar(ctx,sx2,sy2,sz);
      }
    }
    if(u.hp<MAX_HP){
      ctx.font="bold "+Math.floor(TILE*.3)+"px sans-serif";
      ctx.textAlign="right";ctx.textBaseline="alphabetic";
      ctx.lineWidth=3;ctx.strokeStyle="#000";
      ctx.strokeText(u.hp,u.px*TILE+TILE-3,u.py*TILE+TILE-3);
      ctx.fillStyle="#fff";
      ctx.fillText(u.hp,u.px*TILE+TILE-3,u.py*TILE+TILE-3);
    }
  }
  if(sel&&sel.unit&&sel.unit.hp>0){
    const u=sel.unit;
    const m=2+Math.sin(timeNow/180)*2;
    drawCursor(u.px*TILE,u.py*TILE,TILE,m,"#ffd76a");
  }
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    ctx.fillStyle=p.color;
    const s=p.size*TILE;
    ctx.fillRect(p.x*TILE-s/2,p.y*TILE-s/2,s,s);
  }
  ctx.globalAlpha=1;
  for(const r of rings){
    ctx.globalAlpha=Math.max(0,Math.min(1,r.life));
    ctx.strokeStyle="#ffd76a";ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(r.x*TILE,r.y*TILE,r.r*TILE,0,7);ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(const p of popups){
    const yo=(1-p.life)*TILE*.8;
    ctx.font="bold "+Math.floor(TILE*.4)+"px sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.globalAlpha=Math.min(1,p.life*2);
    ctx.lineWidth=4;ctx.strokeStyle="#000";
    ctx.strokeText(p.text,p.x*TILE+TILE/2,p.y*TILE+TILE*.2-yo);
    ctx.fillStyle=p.color;
    ctx.fillText(p.text,p.x*TILE+TILE/2,p.y*TILE+TILE*.2-yo);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
function drawCursor(x,y,s,m,color){
  const L=s*.28;
  ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineCap="round";
  const pts=[
    [x-m,y-m,1,1],[x+s+m,y-m,-1,1],
    [x-m,y+s+m,1,-1],[x+s+m,y+s+m,-1,-1]];
  for(const[px,py,dx,dy]of pts){
    ctx.beginPath();
    ctx.moveTo(px+dx*L,py);ctx.lineTo(px,py);ctx.lineTo(px,py+dy*L);
    ctx.stroke();
  }
}

/* ====================================================
   メインループ
==================================================== */
let lastT=0;
function loop(t){
  const dt=Math.min(50,t-lastT);lastT=t;timeNow=t;
  runAnims(dt);
  for(const p of particles){
    p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;
    p.vy+=4*dt/1000;p.life-=dt/1000;
  }
  particles=particles.filter(p=>p.life>0);
  for(const p of popups)p.life-=dt/900;
  popups=popups.filter(p=>p.life>0);
  for(const r of rings){r.r+=dt/380;r.life-=dt/650;}
  rings=rings.filter(r=>r.life>0);
  for(const u of units)if(u.flash>0)u.flash=Math.max(0,u.flash-dt/180);
  if(shake>0)shake=Math.max(0,shake-dt/40);
  if(map.length)draw();
  requestAnimationFrame(loop);
}

buildSprites();
resize();
requestAnimationFrame(loop);
// 過去のクリアスコアをlocalStorageから復元
try{
  for(let i=0;i<STAGES.length;i++){if(localStorage.getItem(scoreKey(i))!==null)cleared.add(i);}
  // 古い版のスコアキーは掃除しておく（星の誤引き継ぎ防止）
  // ※先に全キーを控えてから消す（消しながら走査すると取りこぼす）
  const allKeys=[];
  for(let k=0;k<localStorage.length;k++){
    const key=localStorage.key(k);
    if(key)allKeys.push(key);
  }
  const keep='mwdx_v'+STAGE_SET_VERSION+'_';
  for(const key of allKeys){
    if(key.indexOf('mwdx_')!==0)continue;      // このゲーム以外は触らない
    if(key==='mwdx_save')continue;             // 途中セーブは残す
    if(key.indexOf(keep)===0)continue;         // 現行版の記録は残す
    localStorage.removeItem(key);
  }
}catch(e){}
/* タイトル画面のHTMLを保存しておき、いつでも復元できるようにする */
const TITLE_HTML=(function(){
  const el=document.getElementById("titleScreen");
  return el?el.outerHTML:"";
})();
/* オーバーレイの欄外（暗い部分）タップで閉じる */
(function initOverlayOutsideTap(){
  const ov=document.getElementById("overlay");
  if(!ov)return;
  ov.addEventListener("pointerdown",e=>{
    if(e.target!==ov)return;          // ダイアログ内のタップは無視
    if(!overlayClosable)return;       // 閉じてよい場面だけ
    closeOverlay();
  });
})();
// タイトル画面を初期描画（バージョン・ユニット絵・つづきから）
showTitleScreen();
